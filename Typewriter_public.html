<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typewriter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08090f;
    color: #f4f4f7;
    min-height: 100vh;
    padding: 25px;
}

.app {
    max-width: 900px;
    margin: auto;
}

header {
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: 38px;
}

.subtitle {
    color: #8f93a3;
    margin-top: 6px;
}

.card {
    background: #10111a;
    border: 1px solid #292c3c;
    border-radius: 22px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

label {
    display: block;
    color: #a9adbd;
    margin-bottom: 8px;
    font-size: 15px;
}

textarea,
input {
    width: 100%;
    background: #070810;
    color: white;
    border: 1px solid #303448;
    border-radius: 15px;
    padding: 16px;
    font-size: 17px;
    outline: none;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

textarea:focus,
input:focus {
    border-color: #6575ff;
}

.counter {
    text-align: right;
    color: #777c90;
    margin-top: 7px;
}

.quick {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px 0;
}

.quick button {
    background: #191b27;
    color: #c9ccda;
    border: 1px solid #303448;
    border-radius: 12px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.quick button:hover {
    border-color: #6676ff;
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 18px;
}

button.main,
button.clear {
    border: 0;
    border-radius: 15px;
    padding: 16px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button.main {
    flex: 1;
    color: white;
    background: linear-gradient(90deg,#7658ff,#568cff);
}

button.clear {
    background: #1b1d28;
    color: white;
}

.status {
    margin-top: 18px;
    font-weight: bold;
}

.ready { color: #62e68b; }
.sending { color: #ffd45c; }
.sent { color: #65a7ff; }
.error { color: #ff6878; }

.history-item {
    padding: 13px;
    border-bottom: 1px solid #242736;
    color: #c6c9d5;
}

.small {
    color: #777c90;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>Typewriter</h1>
    <div class="subtitle">Send. Fast. Easy.</div>
</header>

<div class="card">

    <label>Message</label>

    <textarea
        id="message"
        maxlength="500"
        placeholder="Type anything..."
    ></textarea>

    <div class="counter">
        <span id="count">0</span> / 500
    </div>

    <br>

    <label>Password</label>

    <input
        id="password"
        value="1234"
        type="text"
        autocomplete="off"
    >

    <label style="margin-top:20px;">Quick Messages</label>

    <div class="quick">
        <button onclick="quick('HELLO')">HELLO</button>
        <button onclick="quick('START')">START</button>
        <button onclick="quick('STOP')">STOP</button>
        <button onclick="quick('ON')">ON</button>
        <button onclick="quick('OFF')">OFF</button>
        <button onclick="quick('READY')">READY</button>
        <button onclick="quick('ERROR')">ERROR</button>
        <button onclick="quick('TEST')">TEST</button>
        <button onclick="quick('OK')">OK</button>
        <button onclick="quick('WELCOME')">WELCOME</button>
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearMessage()">CLEAR</button>
        <button class="main" onclick="sendMessage()">SEND</button>
    </div>

    <div id="status" class="status ready">
        READY
    </div>

</div>

<div class="card">
    <h2>Recent Messages</h2>
    <div class="small">Last 5 messages</div>

    <div id="history" style="margin-top:15px;">
        No messages yet.
    </div>
</div>

</div>

<script>

/*
==================================================
TYPEWRITER CONFIG
==================================================

IMPORTANT:
Put the HTTP Transmitter URL here.

Example:

const TRANSMITTER_URL =
    "https://example.com/";

DO NOT put the password here.
The password is entered on the page.
==================================================
*/

const TRANSMITTER_URL = "PUT_YOUR_TRANSMITTER_URL_HERE";

const messageBox = document.getElementById("message");
const passwordBox = document.getElementById("password");
const count = document.getElementById("count");
const statusBox = document.getElementById("status");
const historyBox = document.getElementById("history");

let history = JSON.parse(
    localStorage.getItem("typewriterHistory") || "[]"
);

function updateCounter() {
    count.textContent = messageBox.value.length;
}

messageBox.addEventListener("input", updateCounter);

function quick(text) {
    messageBox.value = text;
    updateCounter();
    messageBox.focus();
}

function clearMessage() {
    messageBox.value = "";
    updateCounter();
    messageBox.focus();
}

function setStatus(text, className) {
    statusBox.textContent = text;
    statusBox.className = "status " + className;
}

function saveHistory(message) {

    history.unshift({
        message: message,
        time: new Date().toLocaleTimeString()
    });

    history = history.slice(0, 5);

    localStorage.setItem(
        "typewriterHistory",
        JSON.stringify(history)
    );

    renderHistory();
}

function renderHistory() {

    if (history.length === 0) {
        historyBox.innerHTML = "No messages yet.";
        return;
    }

    historyBox.innerHTML = history.map(item => `
        <div class="history-item">
            <b>${escapeHtml(item.message)}</b>
            <div class="small">${item.time}</div>
        </div>
    `).join("");
}

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function sendMessage() {

    const message = messageBox.value;
    const password = passwordBox.value;

    if (!message) {
        setStatus("ERROR: Message is empty", "error");
        return;
    }

    if (
        !TRANSMITTER_URL ||
        TRANSMITTER_URL === "PUT_YOUR_TRANSMITTER_URL_HERE"
    ) {
        setStatus(
            "ERROR: Transmitter URL is not configured",
            "error"
        );
        return;
    }

    setStatus("SENDING...", "sending");

    /*
    Automatically create the JSON:

    {"value":"HELLO"}

    It is NOT shown on the page.
    */

    const json = JSON.stringify({
        value: message
    });

    try {

        const url =
            TRANSMITTER_URL +
            (TRANSMITTER_URL.includes("?") ? "&" : "?") +
            "value=" +
            encodeURIComponent(json);

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "password": password
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        setStatus("SENT", "sent");

        saveHistory(message);

    } catch (error) {

        console.error(error);

        setStatus(
            "ERROR: " + error.message,
            "error"
        );
    }
}

messageBox.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }

});

renderHistory();
updateCounter();

</script>

</body>
</html>
