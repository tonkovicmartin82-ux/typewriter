<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typewriter</title>
<style>
:root{--bg:#090b12;--card:#111522;--card2:#0d1019;--line:#232a3a;--text:#f5f7ff;--muted:#8d96aa;--accent:#7c5cff;--accent2:#22c7ff;--ok:#35d07f;--bad:#ff5f6d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#25205c 0,transparent 60%),var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(900px,100%);background:rgba(17,21,34,.9);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px #0008;overflow:hidden}.top{padding:26px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:4px}.status{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px var(--ok)}main{padding:28px}.label{font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}.input,.password{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:16px;font-size:18px;outline:none}.input:focus,.password:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff22}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.btns{display:flex;gap:10px;margin-top:18px}.btn{border:1px solid var(--line);background:#151a29;color:var(--text);padding:13px 18px;border-radius:12px;font-weight:700;cursor:pointer}.send{background:linear-gradient(135deg,var(--accent),#5c8dff);border:0}.btn:active{transform:translateY(1px)}.preview{margin-top:18px;background:#090c14;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:ui-monospace,monospace;font-size:13px;color:#b9c5dc;word-break:break-all}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.history{margin-top:26px}.history-item{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.history-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item small{color:var(--muted)}footer{text-align:center;padding:0 28px 24px;color:#687187;font-size:12px}@media(max-width:650px){.row{grid-template-columns:1fr}.top{padding:20px}.brand{font-size:22px}main{padding:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Typewriter</div><div class="sub">Send. Fast. Easy.</div></div><div class="status"><span class="dot"></span>READY</div></header>
<main>
<div class="label">Message</div>
<input id="message" class="input" autocomplete="off" placeholder="Type anything…">
<div class="meta"><span id="count">0 characters</span><span>Enter = Send</span></div>
<div class="row">
<div><div class="label">Password</div><input id="password" class="password" value="" autocomplete="off"></div>
<div><div class="label">GET & POST Parameters</div><div class="preview" id="json">{"value":""}</div></div>
</div>
<div class="btns"><button class="btn" id="clear">CLEAR</button><button class="btn send" id="send">SEND</button></div>
<div class="preview" id="result">Ready.</div>
<div class="history"><div class="label">Recent Messages</div><div id="history"></div></div>
</main><footer>Typewriter • Build Logic</footer>
</div>
<script>
const message=document.getElementById('message'),password=document.getElementById('password'),json=document.getElementById('json'),result=document.getElementById('result'),count=document.getElementById('count'),history=document.getElementById('history');
let items=JSON.parse(localStorage.getItem('typewriterHistory')||'[]');
function update(){const v=message.value;json.textContent=JSON.stringify({value:v});count.textContent=v.length+' character'+(v.length===1?'':'s')}
function draw(){history.innerHTML=items.map((x,i)=>`<div class="history-item"><span>${escapeHtml(x)}</span><button class="btn" data-i="${i}">RESEND</button></div>`).join('');history.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{message.value=items[+b.dataset.i];update();message.focus()})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){items=[message.value,...items.filter(x=>x!==message.value)].slice(0,5);localStorage.setItem('typewriterHistory',JSON.stringify(items));draw()}
function send(){const v=message.value;if(!v.trim()){result.textContent='ERROR: message is empty.';return}const payload=JSON.stringify({value:v});navigator.clipboard?.writeText(payload).catch(()=>{});save();result.textContent='SENT • Parameters: '+payload;}
message.addEventListener('input',update);message.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});document.getElementById('send').onclick=send;document.getElementById('clear').onclick=()=>{message.value='';update();result.textContent='Ready.';message.focus()};update();draw();
</script>
</body></html>
