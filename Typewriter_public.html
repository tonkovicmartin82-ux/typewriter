<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typewriter v2</title>

<style>
:root{
  --bg:#080a12;
  --panel:#10131f;
  --panel2:#151a29;
  --line:#292f43;
  --text:#f4f6ff;
  --muted:#8f98b3;
  --accent:#7c5cff;
  --accent2:#4da3ff;
  --good:#22d37a;
  --bad:#ff4f6d;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,rgba(124,92,255,.16),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(77,163,255,.12),transparent 30%),
    var(--bg);
}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:230px;
  background:rgba(12,15,25,.92);
  border-right:1px solid var(--line);
  padding:24px 16px;
}

.logo{
  font-size:22px;
  font-weight:800;
  margin-bottom:6px;
}

.logo span{
  color:var(--accent);
}

.tagline{
  color:var(--muted);
  font-size:12px;
  margin-bottom:30px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:12px 14px;
  margin:3px 0;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
  font-size:14px;
}

.nav button:hover,
.nav button.active{
  background:#171b2b;
  color:white;
}

.main{
  flex:1;
  padding:28px;
  max-width:1200px;
  margin:auto;
  width:100%;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  color:var(--muted);
  margin-top:5px;
  font-size:13px;
}

.connection{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:13px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--good);
  box-shadow:0 0 14px var(--good);
}

.dot.error{
  background:var(--bad);
  box-shadow:0 0 14px var(--bad);
}

.grid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:18px;
}

.card{
  background:rgba(16,19,31,.86);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(15px);
}

.card h2{
  font-size:15px;
  margin:0 0 14px;
}

textarea,
input{
  width:100%;
  background:#0b0e18;
  border:1px solid var(--line);
  color:white;
  border-radius:12px;
  padding:14px;
  outline:none;
  font-size:15px;
}

textarea{
  min-height:180px;
  resize:vertical;
}

textarea:focus,
input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,.12);
}

.row{
  display:flex;
  gap:10px;
  margin-top:12px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:12px 0 6px;
}

button.action{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
  color:white;
  background:#20263a;
}

button.action:hover{
  filter:brightness(1.15);
}

.send{
  background:linear-gradient(135deg,var(--accent),var(--accent2)) !important;
  flex:1;
}

.clear{
  background:#242938 !important;
}

.test{
  width:100%;
  margin-top:10px;
}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:11px;
  background:#0b0e18;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

.status.sent{
  color:var(--good);
}

.status.error{
  color:var(--bad);
}

.counter{
  text-align:right;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.quick{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.quick button{
  border:1px solid var(--line);
  background:#121727;
  color:#dce1f5;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
}

.quick button:hover{
  border-color:var(--accent);
}

.history{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0c101b;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  gap:10px;
}

.history-text{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.history-actions{
  display:flex;
  gap:5px;
}

.history-actions button{
  border:0;
  background:#20263a;
  color:white;
  border-radius:7px;
  padding:6px 8px;
  cursor:pointer;
}

.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.stat{
  background:#0c101b;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.stat strong{
  display:block;
  margin-top:4px;
}

.theme-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.theme{
  border:1px solid var(--line);
  background:#0d111c;
  color:white;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.theme.active{
  border-color:var(--accent);
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:25px;
}

@media(max-width:800px){
  .sidebar{
    display:none;
  }

  .main{
    padding:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .top{
    align-items:flex-start;
    gap:15px;
    flex-direction:column;
  }
}

body.light{
  --bg:#eef1f7;
  --panel:#ffffff;
  --panel2:#ffffff;
  --line:#d6dbe8;
  --text:#111522;
  --muted:#657087;
}

body.light .card,
body.light .sidebar{
  background:#fff;
}

body.light textarea,
body.light input,
body.light .status,
body.light .history-item,
body.light .stat{
  background:#f6f7fb;
  color:#111522;
}

body.neon{
  --accent:#ff2bd6;
  --accent2:#00eaff;
  --bg:#050009;
}

body.frutiger{
  --bg:#4eb8ff;
  --panel:rgba(255,255,255,.30);
  --line:rgba(255,255,255,.6);
  --text:#06355c;
  --muted:#14527c;
  --accent:#008cff;
  --accent2:#00c8ff;
}

body.frutiger{
  background:
    radial-gradient(circle at 20% 20%,white 0 3%,transparent 4%),
    linear-gradient(#6bd1ff,#48a9e9 50%,#65c85b);
}

body.frutiger .card,
body.frutiger .sidebar{
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(18px);
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="logo">Type<span>writer</span></div>
  <div class="tagline">Send. Fast. Easy.</div>

  <div class="nav">
    <button class="active">⌂ Home</button>
    <button onclick="document.getElementById('settings').scrollIntoView()">⚙ Settings</button>
    <button onclick="document.getElementById('history').scrollIntoView()">◷ History</button>
    <button>★ Favorites</button>
    <button>▤ Logs</button>
    <button>ⓘ About</button>
  </div>
</aside>

<main class="main">

<div class="top">
  <div>
    <h1>Typewriter v2.0</h1>
    <div class="subtitle">Send messages to Build Logic HTTP Transmitter</div>
  </div>

  <div class="connection">
    <span id="connectionDot" class="dot"></span>
    <span id="connectionText">READY</span>
  </div>
</div>

<div class="grid">

<section>

<div class="card">
  <h2>Message</h2>

  <textarea id="message"
    placeholder="Type anything..."
    maxlength="500"></textarea>

  <div class="counter">
    <span id="count">0</span> / 500
  </div>

  <label>Password</label>
  <input id="password"
    type="text"
    value="1234"
    autocomplete="off">

  <div class="row">
    <button class="action clear" onclick="clearScreen()">CLEAR</button>
    <button class="action send" onclick="sendMessage()">SEND</button>
  </div>

  <div id="status" class="status">
    Ready to send.
  </div>

  <div class="meta">
    <div class="stat">
      <small>LAST SENT</small>
      <strong id="lastSent">Never</strong>
    </div>

    <div class="stat">
      <small>RESPONSE TIME</small>
      <strong id="responseTime">—</strong>
    </div>
  </div>
</div>

<div class="card" style="margin-top:18px">
  <h2>Quick Messages</h2>

  <div class="quick">
    <button onclick="quick('HELLO')">HELLO</button>
    <button onclick="quick('START')">START</button>
    <button onclick="quick('STOP')">STOP</button>
    <button onclick="quick('ON')">ON</button>
    <button onclick="quick('OFF')">OFF</button>
    <button onclick="quick('READY')">READY</button>
    <button onclick="quick('ERROR')">ERROR</button>
    <button onclick="quick('TEST')">TEST</button>
    <button onclick="quick('OK')">OK</button>
    <button onclick="quick('WELCOME')">WELCOME</button>
  </div>
</div>

<div class="card" style="margin-top:18px">
  <h2>Tools</h2>

  <div class="row">
    <button class="action" onclick="copyMessage()">📋 Copy</button>
    <button class="action" onclick="resendLast()">↩ Resend</button>
  </div>

  <button class="action test" onclick="testConnection()">
    🧪 Test Connection
  </button>
</div>

</section>

<section>

<div class="card" id="history">
  <h2>Recent Messages — Last 5</h2>

  <div id="historyList" class="history">
    <div style="color:var(--muted);font-size:13px">
      No messages yet.
    </div>
  </div>

  <button class="action test" onclick="clearHistory()">
    🧹 Clear History
  </button>
</div>

<div class="card" id="settings" style="margin-top:18px">
  <h2>Theme</h2>

  <div class="theme-grid">
    <button class="theme active" onclick="setTheme('dark')">
      🌙 Dark
    </button>

    <button class="theme" onclick="setTheme('light')">
      ☀ Light
    </button>

    <button class="theme" onclick="setTheme('neon')">
      ⚡ Neon
    </button>

    <button class="theme" onclick="setTheme('frutiger')">
      🌊 Frutiger Aero
    </button>
  </div>
</div>

</section>

</div>

<footer>
  Typewriter v2.0 · Build Logic
</footer>

</main>
</div>

<script>

/* =========================================
   BUILD LOGIC TRANSMITTER
   ========================================= */

const TRANSMITTER_URL = "PASTE_YOUR_TRANSMITTER_URL_HERE";


/* =========================================
   ELEMENTS
   ========================================= */

const messageInput = document.getElementById("message");
const passwordInput = document.getElementById("password");
const count = document.getElementById("count");
const statusBox = document.getElementById("status");
const historyList = document.getElementById("historyList");
const connectionDot = document.getElementById("connectionDot");
const connectionText = document.getElementById("connectionText");
const lastSent = document.getElementById("lastSent");
const responseTime = document.getElementById("responseTime");


/* =========================================
   STORAGE
   ========================================= */

let history =
  JSON.parse(localStorage.getItem("typewriterHistory") || "[]");

passwordInput.value =
  localStorage.getItem("typewriterPassword") || "1234";

passwordInput.addEventListener("input", () => {
  localStorage.setItem(
    "typewriterPassword",
    passwordInput.value
  );
});


/* =========================================
   COUNTER
   ========================================= */

messageInput.addEventListener("input", () => {
  count.textContent = messageInput.value.length;
});


/* =========================================
   SEND
   ========================================= */

async function sendMessage(){

  const value = messageInput.value;

  if(!value.trim()){
    setStatus("ERROR: Message is empty.", true);
    return;
  }

  if(
    !TRANSMITTER_URL ||
    TRANSMITTER_URL === "PASTE_YOUR_TRANSMITTER_URL_HERE"
  ){
    setStatus(
      "ERROR: Transmitter URL is not configured.",
      true
    );
    return;
  }

  const password = passwordInput.value;

  const json = JSON.stringify({
    value: value
  });

  /*
    JSON is automatically encoded into the GET request.

    Example:
    {"value":"AHOJ"}

    becomes:

    ?data=%7B%22value%22%3A%22AHOJ%22%7D
  */

  const url =
    TRANSMITTER_URL +
    (TRANSMITTER_URL.includes("?") ? "&" : "?") +
    "data=" +
    encodeURIComponent(json);

  setStatus("SENDING...");
  connectionText.textContent = "SENDING";
  connectionDot.classList.remove("error");

  const start = performance.now();

  try{

    const response = await fetch(url,{
      method:"GET",
      headers:{
        "password":password
      },
      cache:"no-store"
    });

    const time =
      Math.round(performance.now() - start);

    responseTime.textContent = time + " ms";

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    setStatus("SENT ✓");
    statusBox.classList.add("sent");

    connectionText.textContent = "CONNECTED";
    connectionDot.classList.remove("error");

    lastSent.textContent =
      new Date().toLocaleTimeString();

    addHistory(value);

  }catch(error){

    console.error(error);

    setStatus(
      "ERROR: " + error.message,
      true
    );

    connectionText.textContent = "ERROR";
    connectionDot.classList.add("error");

  }

}


/* =========================================
   STATUS
   ========================================= */

function setStatus(text,error=false){

  statusBox.textContent = text;

  statusBox.classList.toggle(
    "error",
    error
  );

  if(!error){
    statusBox.classList.remove("sent");
  }
}


/* =========================================
   QUICK MESSAGE
   ========================================= */

function quick(text){

  messageInput.value = text;
  count.textContent = text.length;

  messageInput.focus();
}


/* =========================================
   CLEAR
   ========================================= */

function clearScreen(){

  messageInput.value = "";
  count.textContent = "0";

  setStatus("Ready to send.");

  messageInput.focus();
}


/* =========================================
   COPY
   ========================================= */

async function copyMessage(){

  if(!messageInput.value){
    setStatus("Nothing to copy.",true);
    return;
  }

  try{

    await navigator.clipboard.writeText(
      messageInput.value
    );

    setStatus("Copied ✓");

  }catch{

    setStatus("Copy failed.",true);

  }
}


/* =========================================
   HISTORY
   ========================================= */

function addHistory(text){

  history.unshift({
    text:text,
    time:new Date().toLocaleTimeString()
  });

  history =
    history.slice(0,5);

  localStorage.setItem(
    "typewriterHistory",
    JSON.stringify(history)
  );

  renderHistory();
}


function renderHistory(){

  if(history.length === 0){

    historyList.innerHTML =
      '<div style="color:var(--muted);font-size:13px">No messages yet.</div>';

    return;
  }

  historyList.innerHTML =
    history.map((item,index)=>`

      <div class="history-item">

        <div>
          <div class="history-text">
            ${escapeHtml(item.text)}
          </div>

          <small style="color:var(--muted)">
            ${item.time}
          </small>
        </div>

        <div class="history-actions">

          <button onclick="useHistory(${index})">
            ↩
          </button>

          <button onclick="copyHistory(${index})">
            📋
          </button>

        </div>

      </div>

    `).join("");
}


function useHistory(index){

  const text =
    history[index].text;

  messageInput.value = text;

  count.textContent =
    text.length;

  messageInput.focus();
}


async function copyHistory(index){

  await navigator.clipboard.writeText(
    history[index].text
  );

  setStatus("Copied ✓");
}


function resendLast(){

  if(history.length === 0){

    setStatus(
      "No previous message.",
      true
    );

    return;
  }

  messageInput.value =
    history[0].text;

  count.textContent =
    messageInput.value.length;

  sendMessage();
}


function clearHistory(){

  history = [];

  localStorage.removeItem(
    "typewriterHistory"
  );

  renderHistory();

  setStatus("History cleared.");
}


/* =========================================
   CONNECTION TEST
   ========================================= */

async function testConnection(){

  if(
    TRANSMITTER_URL ===
    "PASTE_YOUR_TRANSMITTER_URL_HERE"
  ){

    setStatus(
      "ERROR: Transmitter URL is not configured.",
      true
    );

    return;
  }

  setStatus("TESTING...");
  connectionText.textContent = "TESTING";

  const start = performance.now();

  try{

    const response =
      await fetch(
        TRANSMITTER_URL,
        {
          method:"GET",
          headers:{
            "password":
              passwordInput.value
          },
          cache:"no-store"
        }
      );

    responseTime.textContent =
      Math.round(
        performance.now() - start
      ) + " ms";

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    setStatus("Connection OK ✓");

    connectionText.textContent =
      "CONNECTED";

    connectionDot.classList.remove(
      "error"
    );

  }catch(error){

    setStatus(
      "Connection ERROR: " +
      error.message,
      true
    );

    connectionText.textContent =
      "ERROR";

    connectionDot.classList.add(
      "error"
    );
  }
}


/* =========================================
   THEMES
   ========================================= */

function setTheme(theme){

  document.body.className = "";

  if(theme !== "dark"){
    document.body.classList.add(theme);
  }

  localStorage.setItem(
    "typewriterTheme",
    theme
  );

  document
    .querySelectorAll(".theme")
    .forEach(button =>
      button.classList.remove("active")
    );

  event.currentTarget.classList.add(
    "active"
  );
}


const savedTheme =
  localStorage.getItem(
    "typewriterTheme"
  );

if(savedTheme && savedTheme !== "dark"){
  document.body.classList.add(
    savedTheme
  );
}


/* =========================================
   KEYBOARD
   ========================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();
      sendMessage();

    }

    if(
      event.key === "Enter" &&
      event.ctrlKey
    ){

      event.preventDefault();
      sendMessage();

    }

  }
);


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================
   START
   ========================================= */

renderHistory();

</script>

</body>
</html>
