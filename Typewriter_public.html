<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typewriter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 650px;
  padding: 28px;
  border-radius: 24px;
  background: rgba(20, 25, 38, 0.92);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

h1 {
  margin: 0 0 5px;
  font-size: 32px;
}

.subtitle {
  color: #8f9bb3;
  margin-bottom: 25px;
}

textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 18px;
  border-radius: 16px;
  border: 1px solid #30384d;
  background: #0d111b;
  color: white;
  font-size: 18px;
  outline: none;
}

textarea:focus {
  border-color: #6c7cff;
}

.row {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

button {
  flex: 1;
  padding: 14px;
  border: 0;
  border-radius: 13px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
  color: white;
  background: #252d42;
}

button:hover {
  background: #323c57;
}

.send {
  background: #5865f2;
}

.send:hover {
  background: #4752c4;
}

.quick {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.quick button {
  flex: 0 0 auto;
  padding: 9px 13px;
  font-size: 13px;
}

.status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 13px;
  background: #0d111b;
  border: 1px solid #242c3d;
}

.status span {
  font-weight: bold;
}

.ready {
  color: #55e68a;
}

.sending {
  color: #ffd166;
}

.error {
  color: #ff6b6b;
}

.counter {
  text-align: right;
  color: #7f8ba3;
  font-size: 12px;
  margin-top: 6px;
}

.history {
  margin-top: 22px;
}

.history h3 {
  margin-bottom: 10px;
}

.history-item {
  padding: 10px 12px;
  margin-top: 7px;
  border-radius: 10px;
  background: #111725;
  color: #b9c2d4;
  cursor: pointer;
}

.history-item:hover {
  background: #182033;
}
</style>
</head>

<body>

<div class="app">

  <h1>⌨️ Typewriter</h1>
  <div class="subtitle">Build Logic HTTP Transmitter</div>

  <textarea
    id="message"
    maxlength="500"
    placeholder="Type something..."
  ></textarea>

  <div class="counter">
    <span id="count">0</span>/500
  </div>

  <div class="row">
    <button class="send" onclick="sendMessage()">SEND</button>
    <button onclick="clearMessage()">CLEAR</button>
  </div>

  <div class="quick">
    <button onclick="quick('HELLO')">HELLO</button>
    <button onclick="quick('START')">START</button>
    <button onclick="quick('STOP')">STOP</button>
    <button onclick="quick('ON')">ON</button>
    <button onclick="quick('OFF')">OFF</button>
    <button onclick="quick('READY')">READY</button>
    <button onclick="quick('ERROR')">ERROR</button>
    <button onclick="quick('TEST')">TEST</button>
    <button onclick="quick('OK')">OK</button>
    <button onclick="quick('WELCOME')">WELCOME</button>
  </div>

  <div class="status">
    Status:
    <span id="status" class="ready">READY</span>
  </div>

  <div class="history">
    <h3>Recent</h3>
    <div id="history"></div>
  </div>

</div>

<script>
const FIREBASE_URL =
  "https://typewriter-defb-default-rtdb.europe-west1.firebasedatabase.app";

const messageBox = document.getElementById("message");
const count = document.getElementById("count");
const statusText = document.getElementById("status");
const historyBox = document.getElementById("history");

let history = JSON.parse(localStorage.getItem("typewriter_history") || "[]");

messageBox.addEventListener("input", () => {
  count.textContent = messageBox.value.length;
});

function setStatus(text, className) {
  statusText.textContent = text;
  statusText.className = className;
}

async function sendMessage() {
  const message = messageBox.value;

  if (!message.trim()) {
    setStatus("ERROR", "error");
    return;
  }

  setStatus("SENDING", "sending");

  try {
    const response = await fetch(
      FIREBASE_URL + "/typewriter.json",
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          value: message,
          timestamp: Date.now()
        })
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    addHistory(message);

    setStatus("SENT", "ready");

    setTimeout(() => {
      setStatus("READY", "ready");
    }, 1200);

  } catch (error) {
    console.error(error);
    setStatus("ERROR", "error");
  }
}

function quick(text) {
  messageBox.value = text;
  count.textContent = text.length;
  sendMessage();
}

function clearMessage() {
  messageBox.value = "";
  count.textContent = "0";
  messageBox.focus();
}

function addHistory(message) {
  history.unshift(message);
  history = history.slice(0, 5);

  localStorage.setItem(
    "typewriter_history",
    JSON.stringify(history)
  );

  renderHistory();
}

function renderHistory() {
  historyBox.innerHTML = "";

  history.forEach(message => {
    const item = document.createElement("div");

    item.className = "history-item";
    item.textContent = message;

    item.onclick = () => {
      messageBox.value = message;
      count.textContent = message.length;
    };

    historyBox.appendChild(item);
  });
}

messageBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    sendMessage();
  }
});

renderHistory();
</script>

</body>
</html>
